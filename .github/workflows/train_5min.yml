name: "🚂 5-Min Train — Unified Keepalive + All Reports"
# ═══════════════════════════════════════════════════════════════
# 🚂 ĐOÀN TÀU 5 PHÚT — UNIFIED SCHEDULER
# ═══════════════════════════════════════════════════════════════
# Cron: 1/5 = phút :06,:11,:16,:21,:26,:31,:36,:41,:46,:51,:56,:01 MMT
# Offset 6/1 tránh nghẽn phút tròn (:00,:05,:10,:15,:20,:25,:30,:35,:40,:45,:50,:55)
#
# MMT ticks (UTC+6:30): :36,:41,:46,:51,:56,:01,:06,:11,:16,:21,:26,:31
#
# 📋 TRAIN MANIFEST — Xem TRAIN_MANIFEST.md để biết lịch trình đầy đủ
# last-updated: 2026-08-13

# on:
#   schedule:
#     - cron: '1/5 * * * *'   # Every 5 min offset 1 (Disabled ghost cron - single train on tni-sitedown-relay)
on:
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Select report to run manually (Auto = check_time decides)'
        required: false
        type: choice
        default: 'Auto'
        options:
          - 'Auto'
          - '🚨 Toa Site Down - Site Down Relay (:06 / :36)'
          - 'Site Down Relay'
          - '🔌 Toa Cable - Cable Link Down Report (:16 / :46)'
          - 'Cable Link Down Report'
          - 'All Reports (1, 2, 3, 4, 5, 6 - Full Pipeline)'
          - 'Reports 1, 2, 3, 4 - Daily Task & Backlog'
          - 'Report 1, 2, 3 - Daily Backlog (DG & Task)'
          - 'Report 3 - Main DG Material Need'
          - 'Report 3.1 - Asset progress for material'
          - 'Report 4d - Asset progress for material'
          - 'Report 2 (BOD) - BOD Assign'
          - 'Report 4 - Daily EOD Task & Stats'
          - 'Report 5A - Plan Daily'
          - 'Report 5B - Plan compare Result (EOD)'
          - 'Report 5B - Plan compare Result (Update)'
          - 'Report 5A - Plan EOD'
          - 'Report 5B - Plan Update'
          - 'Report 5C - Plan Morning'
          - 'Report 6 - Daily Note Read Report'
          - 'Report 6.1 - Site Clear Today'
          - 'Task - Refuel Request Report'
          - 'Task - Refuel Plan Report 1'
          - 'Task - Refuel Plan Report 2'
          - 'Task - Refuel Plan Report 2.1 - FT Monitor Days'
          - 'Task - Refuel Plan Report 4'
          - 'Task - All Refuel Reports'
          - 'Task - Check Read Status'
          - 'Ghế AUDITOR-9.1 - Master System Audit'
          - 'Toa ETA - Share ETA Reminder'
      skip_delay:
        description: 'Skip random delay (1=yes, 0=no)'
        required: false
        default: '1'

concurrency:
  group: train-5min-singleton
  cancel-in-progress: false    # Queue runs, don't cancel (prevent lost reports)

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      # ═══════════════════════════════════════════════
      # 🏥 TOA 0: KEEPALIVE — Sưởi ấm server (MỌI CHUYẾN)
      # ═══════════════════════════════════════════════
      # Endpoints được sưởi ấm:
      # 1. Search Bot (Vercel /api/search_bot) — tránh cold start 3-5s
      # 2. Asset Collector (Vercel /api/collector) — tránh cold start
      # 3. Site Down Relay (Vercel /api/site_down_relay) — phản hồi nhanh khi site sập
      # 4. Main GAS Backend (@302) — giữ Apps Script quota active
      # 5. Auto Copy Paste GAS — giữ active
      # 6. Construction Bot 10 (GAS) — setWebhook auto-recover
      # Khi thêm hệ thống mới: thêm 1 dòng curl ở đây (~1s/endpoint, max ~150 endpoints)
      - name: "🏥 Toa 0 — Keepalive Ping All Endpoints & Webhooks"
        run: |
          echo "🚂 Train tick: $(TZ='Asia/Yangon' date '+%Y-%m-%d %H:%M:%S MMT')"

          echo "1️⃣ Search Bot (Vercel)..."
          curl -s -f "https://api.telegram.org/bot8606383435:AAEstcN4Om6_9ZAjs4OoFV2uVlRALgae2Ac/getWebhookInfo" || true
          curl -s -f "https://tni-bot.vercel.app/api/search_bot" || true

          echo "2️⃣ Asset Collector (Vercel)..."
          curl -s -f "https://api.telegram.org/bot8928677923:AAE_cJuEDH1tUf5v0q5Wf0UjDHlcp_k1lGM/getWebhookInfo" || true
          curl -s -f "https://tni-bot.vercel.app/api/collector" || true

          echo "3️⃣ Site Down Relay (Vercel)..."
          curl -s -f "https://tni-sitedown.vercel.app/api/site_down_relay" || true
          curl -s -f "https://api.telegram.org/bot8647102342:AAGwI95-xeyFfJZusOOrIPVBER-z6taZHZI/getWebhookInfo" || true

          echo "4️⃣ Main GAS Backend..."
          curl -s -L "https://script.google.com/macros/s/AKfycbz-NZlBk8q2jWb7no6P6zWyD7a_9D3eqpZmPNqniSXJdwkfBPJMJZQ0Babbx2nX_pLEGA/exec?action=ping" || true

          echo "5️⃣ Auto Copy Paste GAS..."
          curl -s -L "https://script.google.com/macros/s/AKfycbwi3J0VrrIE91mnPvIUuykPjwGvNc4y9JDxCNPvJTtOmVAvvalDXu5ZwYZmu5jW-fSo0w/exec?action=ping" || true

          echo "6️⃣ Construction Bot 10 (GAS) — getWebhookInfo..."
          curl -s -f "https://api.telegram.org/bot8903841312:AAHQ_LeI19gs2nrqBSInTsgzJXOuv6H8LmE/getWebhookInfo" || true

          echo "7️⃣ Cable Bot 15 (Vercel)..."
          curl -s -f "https://api.telegram.org/bot8758104446:AAH3o7lMCxBXn70ThAXweH1DddmRkJrgwWo/getWebhookInfo" || true
          curl -s -f "https://tni-bot.vercel.app/api/cable_bot" || true

          echo "✅ Keepalive done"

      # ═══════════════════════════════════════════════
      # 🕐 SCHEDULE CHECK — Xác định toa nào cần chạy
      # ═══════════════════════════════════════════════
      # Tolerance: ±2 phút (GitHub Actions cron có thể delay)
      - name: "🕐 Schedule Check — Determine Active Train Cars"
        id: sched
        run: |
          MMT=$(TZ='Asia/Yangon' date '+%H:%M')
          H=$(TZ='Asia/Yangon' date '+%H')
          M=$(TZ='Asia/Yangon' date '+%M')
          echo "🕐 Myanmar Time: $MMT (H=$H M=$M)"
          echo "mmt=$MMT" >> $GITHUB_OUTPUT

          # Flags
          NEED_PYTHON=false
          R1234=false; R4=false; BOD=false; P5A=false; P5B=false; P5C=false
          R6=false; R61=false; CABLE=false; REFUEL_REQ=false
          REFUEL_P1=false; REFUEL_P2=false; REFUEL_P21=false; REFUEL_P4=false
          AUDITOR91=false; SHARE_ETA=false; SITE_DOWN=false; CABLE_LD=false

          # check_time <hour> <target_minute> — dung sai ±4 phút (nới rộng do GitHub Actions delay thường xuyên 3-5p)
          check_time() {
            local TH=$1 TM=$2
            local CURR_MIN=$(( 10#$H * 60 + 10#$M ))
            local TARG_MIN=$(( 10#$TH * 60 + 10#$TM ))
            local DIFF=$(( CURR_MIN - TARG_MIN ))
            [ $DIFF -lt 0 ] && DIFF=$(( -DIFF ))
            # Tolerance: ±5 phút (nới rộng kháng độ trễ GitHub Actions runner 3-6 phút)
            [ $DIFF -le 5 ] && return 0
            return 1
          }


          # check_time_exact <hour> <target_minute> — dung sai ±2 phút cho các mốc đơn lẻ duy nhất (kháng trùng lặp nhịp 5p)
          check_time_exact() {
            local TH=$1 TM=$2
            local CURR_MIN=$(( 10#$H * 60 + 10#$M ))
            local TARG_MIN=$(( 10#$TH * 60 + 10#$TM ))
            local DIFF=$(( CURR_MIN - TARG_MIN ))
            [ $DIFF -lt 0 ] && DIFF=$(( -DIFF ))
            [ $DIFF -le 2 ] && return 0
            return 1
          }


          # ═══════ ☀️ MORNING BLOCK (05:00-10:00) ═══════
          #  05:46 → Reports 1,2,3 + BOD (🤖 Bot API)
          check_time 05 46 && R1234=true && BOD=true && NEED_PYTHON=true && echo "🚃 Toa 1+11: Reports 1-3 + BOD (05:46 MMT)"
          #  05:51 → Report 4 (Daily EOD Task & Stats) — TOA 12 RIÊNG (+5 phút)
          check_time 05 51 && R4=true && NEED_PYTHON=true && echo "🚃 Toa 12: Report 4 EOD Task (05:51 MMT)"
          #  05:56 → Cable Daily Report [ĐÃ HỦY THEO YÊU CẦU NGƯỜI DÙNG]
          #  06:06 → Report 5 (Daily Plan - Ca Sáng) (📱 Telethon)
          check_time 06 06 && P5C=true && NEED_PYTHON=true && echo "🚃 Toa 5: Report 5 Daily Plan Morning (06:06 MMT)"
          #  07:06 → Refuel Request Report [ĐÃ HỦY - GỘP VÀO TOA 9 LÚC 10:06 & 14:11]
          #  10:06 → Refuel Merged Report (📱 Telethon)
          check_time 10 06 && REFUEL_P1=true && NEED_PYTHON=true && echo "🚃 Toa 9: Refuel Merged Report (10:06 MMT)"
          #  07:18 → Report 6.1 Site Clear Today (🤖 Bot API)
          check_time_exact 07 18 && R61=true && NEED_PYTHON=true && echo "🚃 Toa 6.1: Report 6.1 Site Clear Today (07:18 MMT)"
          #  08:28 → Plan 5C Morning
          check_time_exact 08 28 && P5C=true && NEED_PYTHON=true && echo "🚃 Toa 5: Plan 5C Morning (08:28 MMT)"
          #  08:48 → Report 6 Read Report (Ca 1) (📱 Telethon)
          check_time_exact 08 48 && R6=true && NEED_PYTHON=true && echo "🚃 Toa 6: Report 6 Read (08:48 MMT)"
          #  09:00 → Ghế AUDITOR-9.1 (Master System Audit — Chạy đúng 1 lần duy nhất)
          check_time_exact 09 00 && AUDITOR91=true && NEED_PYTHON=true && echo "🚃 Toa Auditor: Ghế AUDITOR-9.1 (09:00 MMT)"
          #  09:56 → Plan 5C Morning
          check_time 09 56 && P5C=true && NEED_PYTHON=true && echo "🚃 Toa 5: Plan 5C Morning (09:56 MMT)"
          #  10:16 / 10:18 → Report 6.1 Site Clear Today & Refuel Group 9 Read Report (10:16 MMT)
          check_time 10 16 && REFUEL_READ=true && NEED_PYTHON=true && echo "🚃 Toa Refuel Read: Refuel Group 9 Read Report (10:16 MMT)"
          check_time_exact 10 18 && R61=true && NEED_PYTHON=true && echo "🚃 Toa 6.1: Report 6.1 Site Clear Today (10:18 MMT)"

          # ═══════ 🌤️ AFTERNOON BLOCK (13:00-16:30) ═══════
          #  13:06 → Refuel Request Report [ĐÃ HỦY - GỘP VÀO TOA 9 LÚC 10:06 & 14:11]
          #  14:11 → Refuel Merged Report (📱 Telethon)
          check_time 14 11 && REFUEL_P1=true && NEED_PYTHON=true && echo "🚃 Toa 9: Refuel Merged Report (14:11 MMT)"
          #  14:18 → Report 6.1 Site Clear Today (🤖 Bot API)
          check_time_exact 14 18 && R61=true && NEED_PYTHON=true && echo "🚃 Toa 6.1: Report 6.1 Site Clear Today (14:18 MMT)"
          #  14:58 → Report 6 Read Report (Ca 2) (📱 Telethon)
          check_time_exact 14 58 && R6=true && NEED_PYTHON=true && echo "🚃 Toa 6: Report 6 Read (14:58 MMT)"
          #  15:26 → Plan 5C Evening (📱 Telethon)
          check_time 15 26 && P5C=true && NEED_PYTHON=true && echo "🚃 Toa 5: Plan 5C Evening (15:26 MMT)"
          #  15:46 → Reports 1,2,3 + BOD (🤖 Bot API)
          check_time 15 46 && R1234=true && BOD=true && NEED_PYTHON=true && echo "🚃 Toa 1+11: Reports 1-3 + BOD (15:46 MMT)"
          #  15:51 → Report 4 (Daily EOD Task & Stats) — TOA 12 RIÊNG (+5 phút)
          check_time 15 51 && R4=true && NEED_PYTHON=true && echo "🚃 Toa 12: Report 4 EOD Task (15:51 MMT)"
          #  15:56 → Cable Daily Report [ĐÃ HỦY THEO YÊU CẦU NGƯỜI DÙNG]

          # 🚨 Site Down Relay: ĐÃ TÁCH HẲN sang botlookup_relay.yml (cron 6,36 UTC = :36,:06 MMT)

          # ═══════ 🌙 EVENING BLOCK (17:00-22:30) ═══════
          #  17:18 → Report 6 & Report 6.1
          check_time_exact 17 18 && R6=true && R61=true && NEED_PYTHON=true && echo "🚃 Toa 6+6.1: Report 6 + Report 6.1 Site Clear Today (17:18 MMT)"
          #  18:06 → [DISABLED] Refuel — chuyển sang 20:56
          #  18:41 → Report 5 (Daily Plan - Ca Chiều / EOD Plan vs Actual) (📱 Telethon)
          check_time 18 41 && P5A=true && NEED_PYTHON=true && echo "🚃 Toa 3: Report 5 Daily Plan EOD (18:41 MMT)"
          #  19:11 → Report 5 (Daily Plan - Ca Tối / Plan Update) (📱 Telethon)
          check_time 19 11 && P5B=true && NEED_PYTHON=true && echo "🚃 Toa 4: Report 5 Daily Plan Update (19:11 MMT)"
          #  19:41 → Report 6 Read Report (Ca 3) (📱 Telethon)
          check_time 19 41 && R6=true && NEED_PYTHON=true && echo "🚃 Toa 6: Report 6 Read (19:41 MMT)"
          #  20:26 → Refuel Group 9 Read Report (Sent to Bot 2)
          check_time 20 26 && REFUEL_READ=true && NEED_PYTHON=true && echo "🚃 Toa Refuel Read: Refuel Group 9 Read Report (20:26 MMT)"
          #  20:56 → Refuel Merged Report + Members Not Joined (📱 Telethon)
          check_time 20 56 && REFUEL_P1=true && REFUEL_P4=true && NEED_PYTHON=true && echo "🚃 Toa 9+11: Refuel Merged + Members (20:56 MMT)"
          #  22:06 → Plan 5C Evening
          check_time 22 06 && P5C=true && NEED_PYTHON=true && echo "🚃 Toa 5: Plan 5C Evening (22:06 MMT)"

          # 🚨 TOA SITE DOWN: Khởi hành tại nhịp :06 và :36 MMT mỗi giờ (hoạt động 03:30 - 22:15 MMT)
          CURR_M=$(( 10#$M ))
          DIFF_06=$(( CURR_M - 6 ))
          [ $DIFF_06 -lt 0 ] && DIFF_06=$(( -DIFF_06 ))
          DIFF_36=$(( CURR_M - 36 ))
          [ $DIFF_36 -lt 0 ] && DIFF_36=$(( -DIFF_36 ))
          if [ $DIFF_06 -le 2 ] || [ $DIFF_36 -le 2 ]; then
            CURR_TOTAL_MIN=$(( 10#$H * 60 + 10#$M ))
            if [ $CURR_TOTAL_MIN -ge $(( 3 * 60 + 30 )) ] && [ $CURR_TOTAL_MIN -le $(( 22 * 60 + 15 )) ]; then
              SITE_DOWN=true
              NEED_PYTHON=true
              echo "🚨 Toa Site Down: Site Down Relay (:06/:36 MMT)"
            fi
          fi

          # 🔌 TOA CABLE LINK DOWN: Khởi hành tại nhịp :16 và :46 MMT mỗi giờ (10 phút sau Site Down :06/:36)
          DIFF_16=$(( CURR_M - 16 ))
          [ $DIFF_16 -lt 0 ] && DIFF_16=$(( -DIFF_16 ))
          DIFF_46=$(( CURR_M - 46 ))
          [ $DIFF_46 -lt 0 ] && DIFF_46=$(( -DIFF_46 ))
          if [ $DIFF_16 -le 2 ] || [ $DIFF_46 -le 2 ]; then
            CABLE_LD=true
            NEED_PYTHON=true
            echo "🔌 Toa Cable: Cable Link Down Report (:16/:46 MMT)"
          fi

          # 📋 Share ETA Reminder: ĐÃ ĐƯỢC LIÊN KẾT TRỰC TIẾP QUA GAS (30s sau Bot 5T)
          # Tắt kích hoạt tự động theo cron :11/:41 trên train_5min để tránh bị trễ 5 phút và trùng lặp
          # Vẫn cho phép kích hoạt thủ công qua workflow_dispatch
          SHARE_ETA=false

          # Output all flags
          echo "need_python=$NEED_PYTHON" >> $GITHUB_OUTPUT
          echo "site_down=$SITE_DOWN" >> $GITHUB_OUTPUT
          echo "cable_ld=$CABLE_LD" >> $GITHUB_OUTPUT
          echo "r1234=$R1234" >> $GITHUB_OUTPUT
          echo "r4=$R4" >> $GITHUB_OUTPUT
          echo "bod=$BOD" >> $GITHUB_OUTPUT
          echo "p5a=$P5A" >> $GITHUB_OUTPUT
          echo "p5b=$P5B" >> $GITHUB_OUTPUT
          echo "p5c=$P5C" >> $GITHUB_OUTPUT
          echo "r6=$R6" >> $GITHUB_OUTPUT
          echo "r61=$R61" >> $GITHUB_OUTPUT
          echo "cable=$CABLE" >> $GITHUB_OUTPUT
          echo "refuel_req=$REFUEL_REQ" >> $GITHUB_OUTPUT
          echo "refuel_p1=$REFUEL_P1" >> $GITHUB_OUTPUT
          echo "refuel_p2=$REFUEL_P2" >> $GITHUB_OUTPUT
          echo "refuel_p21=$REFUEL_P21" >> $GITHUB_OUTPUT
          echo "refuel_p4=$REFUEL_P4" >> $GITHUB_OUTPUT
          echo "refuel_read=$REFUEL_READ" >> $GITHUB_OUTPUT
          echo "auditor91=$AUDITOR91" >> $GITHUB_OUTPUT
          echo "share_eta=$SHARE_ETA" >> $GITHUB_OUTPUT

          if [ "$NEED_PYTHON" = "false" ]; then
            echo "🏥 Keepalive-only tick, no reports to send."
          fi

      # ═══════════════════════════════════════════════
      # 🐍 SETUP PYTHON (chỉ khi có report cần chạy)
      # ═══════════════════════════════════════════════
      - name: Checkout repository
        if: steps.sched.outputs.need_python == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        if: steps.sched.outputs.need_python == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.sched.outputs.need_python == 'true' || github.event_name == 'workflow_dispatch'
        run: pip install python-telegram-bot requests pandas python-dotenv telethon openpyxl

      # ═══════════════════════════════════════════════
      # 🚨 TOA SITE DOWN: Site Down Relay (Nhịp :06 và :36 MMT)
      # 📱 Engine: Telethon (Gửi /down_tni@auto_nocpro_bot -> đọc phản hồi -> gọi GAS)
      # ⏰ Schedule: :06 và :36 Myanmar (03:30 - 22:15 MMT)
      # ═══════════════════════════════════════════════
      - name: "🚨 Toa Site Down — Site Down Relay (:06 / :36 MMT)"
        continue-on-error: true
        if: |
          steps.sched.outputs.site_down == 'true' ||
          (github.event_name == 'workflow_dispatch' && (
            inputs.report_type == 'Site Down Relay' ||
            inputs.report_type == '🚨 Toa Site Down - Site Down Relay (:06 / :36)' ||
            inputs.report_type == 'All Reports (1, 2, 3, 4, 5, 6 - Full Pipeline)'
          ))
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          SD_APPS_SCRIPT_URL: ${{ secrets.SD_APPS_SCRIPT_URL }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          REFUEL_APPS_SCRIPT_URL: ${{ secrets.REFUEL_APPS_SCRIPT_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.report_type }}" = "Site Down Relay" ]; then
            python botlookup_relay.py --force || true
          else
            python botlookup_relay.py || true
          fi

      # ═══════════════════════════════════════════════
      # 🔌 TOA CABLE: Cable Link Down Report (Nhịp :16 và :46 MMT)
      # 🤖 Engine: Bot API (15 TNI CABLE)
      # ⏰ Schedule: :16 và :46 Myanmar (10 phút sau Site Down :06/:36)
      # ═══════════════════════════════════════════════
      - name: "🔌 Toa Cable — Cable Link Down Report (:16 / :46 MMT)"
        continue-on-error: true
        if: |
          steps.sched.outputs.cable_ld == 'true' ||
          (github.event_name == 'workflow_dispatch' && (
            inputs.report_type == 'Cable Link Down Report' ||
            inputs.report_type == '🔌 Toa Cable - Cable Link Down Report (:16 / :46)' ||
            inputs.report_type == 'All Reports (1, 2, 3, 4, 5, 6 - Full Pipeline)'
          ))
        env:
          CABLE_BOT_TOKEN: ${{ secrets.CABLE_BOT_TOKEN }}
          CABLE_CHAT_ID: ${{ secrets.CABLE_CHAT_ID }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python cable_link_down_report.py || true

      # ═══════════════════════════════════════════════
      # 📊 TOA 1+11: Reports 1,2,3,4 + BOD Assign
      # 🤖 Engine: Bot API (SEND_BOT + REPORT_TASK_BOT + TECHNICAL_DEP_BOT)
      # ⏰ Schedule: 05:48, 15:48 Myanmar
      # ═══════════════════════════════════════════════
      - name: "📊 Toa 1+11 — Reports 1,2,3 + BOD Assign"
        continue-on-error: true
        if: |
          steps.sched.outputs.r1234 == 'true' ||
          (github.event_name == 'workflow_dispatch' && (
            inputs.report_type == 'Reports 1, 2, 3, 4 - Daily Task & Backlog' ||
            inputs.report_type == 'Report 1, 2, 3 - Daily Backlog (DG & Task)' ||
            inputs.report_type == 'Report 3 - Main DG Material Need' ||
            inputs.report_type == 'Report 2 (BOD) - BOD Assign' ||
            inputs.report_type == 'All Reports (1, 2, 3, 4, 5, 6 - Full Pipeline)'
          ))
        env:
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          REPORT_TASK_BOT_TOKEN: ${{ secrets.REPORT_TASK_BOT_TOKEN }}
          TECHNICAL_DEP_BOT_TOKEN: ${{ secrets.TECHNICAL_DEP_BOT_TOKEN }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          if [ "${{ inputs.report_type }}" = "Report 2 (BOD) - BOD Assign" ]; then
            python daily_bod_assign.py || true
          elif [ "${{ inputs.report_type }}" = "Report 3 - Main DG Material Need" ] || [ "${{ inputs.report_type }}" = "Report 1, 2, 3 - Daily Backlog (DG & Task)" ]; then
            python backlog_send.py --now || true
          else
            python daily_bod_assign.py || true
            python backlog_send.py --now || true
          fi

      # ═══════════════════════════════════════════════
      # 📋 TOA 12: Report 4 — Daily EOD Task & Stats
      # 🤖 Engine: Bot API + Telethon (Note reply)
      # ⏰ Schedule: 05:51, 15:51 Myanmar (+5 phút sau Toa 1+11)
      # ═══════════════════════════════════════════════
      - name: "📋 Toa 12 — Report 4 (EOD Task & Stats + Asset 4d + Note)"
        continue-on-error: true
        if: |
          steps.sched.outputs.r4 == 'true' ||
          (github.event_name == 'workflow_dispatch' && (
            inputs.report_type == 'Reports 1, 2, 3, 4 - Daily Task & Backlog' ||
            inputs.report_type == 'Report 4 - Daily EOD Task & Stats' ||
            inputs.report_type == 'Report 3.1 - Asset progress for material' ||
            inputs.report_type == 'Report 4d - Asset progress for material' ||
            inputs.report_type == 'All Reports (1, 2, 3, 4, 5, 6 - Full Pipeline)'
          ))
        env:
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          REPORT_TASK_BOT_TOKEN: ${{ secrets.REPORT_TASK_BOT_TOKEN }}
