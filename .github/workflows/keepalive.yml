# GitHub Actions — Keep Search Bot Warm (chạy mỗi 5 phút)
# Dùng cho repo: MON6879/tni-search
# Ping Vercel endpoint để tránh cold start

name: Search Bot Keep-Alive

on:
  schedule:
    - cron: '*/5 * * * *'   # Mỗi 5 phút, 24/7
  workflow_dispatch:         # Cho phép chạy thủ công

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Search Bot (keep warm)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://tni-done.vercel.app/api/search_bot" \
            --max-time 10)
          echo "Search Bot status: $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "405" ]; then
            echo "WARNING: Unexpected status $STATUS"
          else
            echo "OK: Search Bot is warm"
          fi
