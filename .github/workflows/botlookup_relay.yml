name: "🚨 Botlookup Relay — Dedicated :06/:36 MMT (SOLE Runner)"

on:
  schedule:
    # ⚠️ Cron 3,33 UTC = :03 and :33 MMT -> Python sleeps until exact :06 and :36 MMT
    - cron: '3,33 * * * *'
  workflow_dispatch:
    inputs:
      skip_delay:
        description: 'Skip random delay (1=yes, 0=no)'
        required: false
        default: '1'

concurrency:
  group: botlookup-relay
  cancel-in-progress: false

jobs:
  botlookup-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Task — Botlookup Relay
        env:
          TELEGRAM_API_ID:        ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:      ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION:       ${{ secrets.TELEGRAM_SESSION }}
          SD_APPS_SCRIPT_URL:     ${{ secrets.SD_APPS_SCRIPT_URL }}
          APPS_SCRIPT_URL:        ${{ secrets.APPS_SCRIPT_URL }}
          REFUEL_APPS_SCRIPT_URL: ${{ secrets.REFUEL_APPS_SCRIPT_URL }}
          SD_BOTLOOKUP_CHAT_ID:   ${{ secrets.SD_BOTLOOKUP_CHAT_ID }}
          SEND_BOT_TOKEN:         ${{ secrets.SEND_BOT_TOKEN }}
          SKIP_DELAY:             '1'
          MANUAL_RUN:             ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python botlookup_relay.py --force
          else
            python botlookup_relay.py
          fi
